<main>
<h1>Un turno en el depósito</h1>
<div id="stage"><div id="message" role="status">Cargando escena 3D…</div></div>

<input id="seek" aria-label="Posición de la animación" type="range" min="0" max="24" step="0.01" value="0" disabled>
</div>
<p id="step"></p>
<small>Arrastrá para girar la cámara. Usá la rueda o dos dedos para acercarte.</small>
</main>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script type="module">

}
const stage = document.querySelector('#stage');
const scene = new THREE.Scene();
scene.background = new THREE.Color('#f7f2e6');
const renderer = new THREE.WebGLRenderer({antialias:false});

stage.prepend(renderer.domElement);
renderer.domElement.setAttribute('aria-label','Maqueta 3D del depósito');
const camera = new THREE.OrthographicCamera(-8,8,5,-5,.1,100);
camera.position.set(12,10,16);
const orbit = createDioramaOrbit(camera,renderer.domElement,{
  target:new THREE.Vector3(0,1,0), minPolarAngle:.2, maxPolarAngle:1.48

orbit.controls.minZoom = .65;
orbit.controls.maxZoom = 2.5;
scene.add(new THREE.HemisphereLight('#fff4db','#849489',2.05));
const sun = new THREE.DirectionalLight('#fff2d8',2.15);
sun.position.set(-4,9,6);
scene.add(sun);
const materials = new Map();

}
function box(parent,x,y,z,w,h,d,color) {

const dark='#26373a', blue='#294d59', orange='#c66136', yellow='#eab23f', wood='#8a613d';
box(scene,0,-.32,0,14,.62,9,dark);
box(scene,0,-.04,0,13.8,.14,8.8,'#85928a');
for(let x=-6;x<=6;x++) box(scene,x,.036,0,.017,.01,8.7,'#72847b');
for(let z=-4;z<=4;z++) box(scene,0,.036,z,13.7,.01,.017,'#72847b');
for(let x=-6;x<=6;x+=.7) box(scene,x,.05,2.1,.35,.02,.075,yellow);
for(let x=-5.9;x<=6;x+=.46) box(scene,x,.055,4.15,.26,.019,.1,orange);
function cargo(parent,x,y,z,color='#9d693e') {
  const group = new THREE.Group(); parent.add(group); group.position.set(x,y,z);
  for(let i=-1;i<=1;i++) box(group,i*.40,.06,0,.15,.12,1.18,wood);
  box(group,0,.15,0,.96,.065,1.23,'#b18a59');
  for(let row=0;row<2;row++) for(let col=0;col<2;col++) {
    const dx=(col-.5)*.46, dz=(row-.5)*.55;
    box(group,dx,.43,dz,.44,.49,.53,color);
    box(group,dx,.679,dz,.085,.01,.51,'#c19863');
    box(group,dx,.44,dz+.268,.13,.09,.01,'#d4c19e');
  }
  return group;
}
for(const x of [-3.1,-1.1,.9,2.9,4.9,6.6]) {
  for(const z of [-3.92,-2.35]) box(scene,x,1.7,z,.13,3.38,.13,blue);
  for(const y of [.35,1.65,2.97]) box(scene,x,y,-3.12,.125,.105,1.61,blue);
}
for(const y of [.36,1.66,2.98]) {
  for(const z of [-3.92,-2.35]) box(scene,1.75,y,z,9.83,.13,.13,orange);
  for(const x of [-2.1,-.1,1.9,3.9,5.75]) box(scene,x,y+.065,-3.14,1.83,.046,1.43,'#73776c');
}
for(const [x,y,color] of [[-2.1,.45,'#858354'],[-.1,1.75,'#a77b50'],[1.9,3.07,'#777c5b'],[3.9,.45,'#8e8064'],[5.75,1.75,'#978252']]) cargo(scene,x,y,-3.08,color);
for(let i=0;i<3;i++) cargo(scene,-5.55,.03,-2.9+i*1.5,['#827e54','#9a7746','#83755d'][i]);
const truck = new THREE.Group(); scene.add(truck);
const truckShadow = new THREE.Mesh(new THREE.CircleGeometry(1,24),new THREE.MeshBasicMaterial({color:'#24342d',transparent:true,opacity:.22,depthWrite:false}));
truckShadow.rotation.x=-Math.PI/2;
truckShadow.scale.set(.86,1.28,1);
truckShadow.position.y=.047;
truck.add(truckShadow);
box(truck,0,.4,.14,1.14,.51,1.69,yellow);
box(truck,0,.65,.57,1.03,.45,.68,'#cf8f21');
box(truck,0,.58,-.05,.84,.15,.65,dark);
for(const x of [-.48,.48]) for(const z of [-.55,.66]) box(truck,x,1.17,z,.085,1.22,.085,dark);
box(truck,0,1.8,.07,1.09,.12,1.53,yellow);
for(let i=0;i<5;i++) box(truck,0,1.87,-.49+i*.27,.94,.03,.06,dark);
box(truck,0,.78,.32,.36,.16,.32,dark);
box(truck,0,.96,.46,.36,.34,.12,dark);
box(truck,0,.99,-.36,.43,.11,.16,dark);
box(truck,0,1.02,.13,.31,.34,.27,'#3a6269');
box(truck,0,1.26,.11,.22,.23,.22,'#b58057');
box(truck,0,1.40,.10,.28,.12,.27,'#eaa72d');
box(truck,0,1.49,.76,.36,.11,.045,'#ed8a56');
box(truck,.35,1.93,.44,.12,.17,.12,'#f09e37');
for(const z of [-.59,.63]) for(const x of [-.61,.61]) {
  const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.275,.275,.22,12),material('#252b29'));
  wheel.rotation.z=Math.PI/2; wheel.position.set(x,.3,z); truck.add(wheel);
  box(truck,x*1.195,.3,z,.025,.22,.22,'#55605a');
}
for(const x of [-.37,.37]) box(truck,x,1.42,-.85,.105,2.79,.13,dark);
const carriage=new THREE.Group(); truck.add(carriage);
box(carriage,0,.22,-.93,.96,.38,.1,blue);
for(const x of [-.23,.23]) box(carriage,x,.047,-1.6,.115,.082,1.36,dark);
const load=cargo(scene,1.9,.04,-.22);
const belt = new THREE.Group(); scene.add(belt); belt.position.set(-4.9,0,2.95);
box(belt,0,.44,0,3,.15,.88,blue);
for(const x of [-1.3,1.3]) for(const z of [-.3,.3]) box(belt,x,.23,z,.12,.44,.12,dark);
for(const z of [-.46,.46]) box(belt,0,.62,z,3,.12,.075,orange);
const rollers=Array.from({length:15},(_,i)=>box(belt,i*.2-1.4,.55,0,.085,.055,.78,'#697b7a'));
const parcels=Array.from({length:3},()=>box(belt,0,.75,0,.42,.34,.52,'#aa7547'));
function worker(color) {
  const body=new THREE.Group(); scene.add(body);
  box(body,0,.8,0,.33,.5,.23,color);
  box(body,0,.89,0,.335,.075,.235,'#ead796');
  box(body,0,1.16,0,.21,.22,.205,'#a87055');
  box(body,0,1.28,.025,.265,.12,.265,yellow);
  const limbs=[];
  for (const sign of [-1,1]) {
    const leg=new THREE.Group(),arm=new THREE.Group();
    leg.position.set(sign*.09,.56,0);arm.position.set(sign*.215,1,0);
    body.add(leg,arm);
    box(leg,0,-.24,0,.125,.48,.135,dark);
    box(leg,0,-.49,.045,.135,.12,.22,'#272e2c');
    box(arm,0,-.185,0,.115,.36,.12,color);
    limbs.push({leg,arm,sign});
  }
  return {body,limbs};
}
const crew=[worker('#347b77'),worker('#c65d40')];
function walk(worker,x,z,direction,t,stride) {
  worker.body.position.set(x,.04+Math.abs(Math.sin(t*2))*stride*.035,z);
  worker.body.rotation.y=direction;
  for(const {leg,arm,sign} of worker.limbs){
    leg.rotation.x=Math.sin(t)*sign*stride;
    arm.rotation.x=-leg.rotation.x*.73;
  }
}
const beacon=box(truck,.35,2.035,.44,.105,.055,.104,'#ffd56d');
beacon.material=beacon.material.clone();
const warningLight=new THREE.PointLight('#ff9b30',0,2.6,2);
warningLight.position.set(.35,2.1,.44); truck.add(warningLight);
const returnLoad=cargo(scene,1.9,1.75,-3.08,'#a47a4b');
function animateWarehouse(t) {
  for(let i=0;i<rollers.length;i++) rollers[i].rotation.z=t*5+i*.4;
  for(let i=0;i<parcels.length;i++){
    const distance=(t*.25+i)%3;
    parcels[i].position.x=distance-1.5;
    const scale=Math.min(1,distance/.24,(3-distance)/.24);
    parcels[i].scale.setScalar(scale);
  }
  const route=t*Math.PI/6, smallRoute=t*Math.PI/4;
  walk(crew[0],-4+Math.sin(route)*1.15,1.62,Math.cos(route)>=0?Math.PI/2:-Math.PI/2,t*Math.PI*2,Math.abs(Math.cos(route))*.63);
  walk(crew[1],4.95,.9+Math.sin(smallRoute)*.85,Math.cos(smallRoute)>=0?0:Math.PI,t*Math.PI*2,.55*Math.abs(Math.cos(smallRoute)));

  warningLight.intensity=flash*3;
  beacon.material.emissive.setRGB(flash*.7,flash*.24,flash*.025);
  sun.intensity=2.04+Math.sin(t*Math.PI/12)*.16;
}
const timeline=[
  [0,3.6,0,'Se acerca al pallet'],
  [3,1.52,0,'Toma el pallet'],
  [4.5,1.52,.24,'Eleva la carga'],
  [6,1.52,1.71,'Eleva la carga'],
  [9,-1.34,1.71,'Coloca el pallet en el rack'],
  [10,-1.34,1.66,'Apoya el pallet'],
  [11,-1.34,1.66,'Retira las horquillas'],
  [14,1.52,1.66,'Retira las horquillas'],
  [16,1.52,0,'Vuelve al pasillo'],
  [18,1.52,1.66,'El depósito sigue en marcha'],
  [20,-1.34,1.66,'Recoge el siguiente pallet'],
  [21,-1.34,1.71,'Retira la carga del rack'],
  [22,1.52,1.71,'Baja la carga a la zona de recepción'],
  [23,1.52,0,'Deja el pallet en recepción'],
  [24,3.6,0,'Se acerca al pallet']
];
const seek=document.querySelector('#seek'), step=document.querySelector('#step');
const play=document.querySelector('#play'), reset=document.querySelector('#reset');
function draw(t) {
  const next=timeline.findIndex(row=>row[0]>t);
  const a=timeline[next<0?timeline.length-1:next-1];
  const b=timeline[next<0?timeline.length-1:next];
  const fraction=a===b?0:(t-a[0])/(b[0]-a[0]);
  const ease=fraction*fraction*(3-2*fraction);
  truck.position.set(1.9,0,THREE.MathUtils.lerp(a[1],b[1],ease));
  carriage.position.y=THREE.MathUtils.lerp(a[2],b[2],ease);

  else if(t<10) load.position.set(1.9,carriage.position.y+.035+Math.min(.055,carriage.position.y),truck.position.z-1.74);
  else load.position.set(1.9,1.75,-3.08);
  returnLoad.visible=t>=10&&t<23;
  if(t>=20) returnLoad.position.set(1.9,carriage.position.y+.035+Math.min(.055,carriage.position.y),truck.position.z-1.74);
  else returnLoad.position.set(1.9,1.75,-3.08);
  load.visible=t<10||t>=23;
  if(t>=23) load.position.set(1.9,.035,-.22);
  animateWarehouse(t);

  seek.value=t;

}
function resize() {
  const w=stage.clientWidth,h=stage.clientHeight,aspect=w/h;
  const half=Math.max(4.9,7.6/aspect);
  Object.assign(camera,{left:-half*aspect,right:half*aspect,top:half,bottom:-half});
  camera.updateProjectionMatrix();
  renderer.setSize(Math.round(w*.51),Math.round(h*.51),false);
}
const duration=24;
let time=0,last=performance.now();
let playing=!matchMedia('(prefers-reduced-motion: reduce)').matches;
function setPlaying(value) { playing=value;play.textContent=playing?'Pausa':'Reproducir'; }
setPlaying(playing);
play.onclick=()=>{if(!playing&&time===duration) time=0;setPlaying(!playing);};
reset.onclick=orbit.reset;

resize();
draw(0);

window.__dioramaReady=true;

  const delta=Math.min(.05,(now-last)/1000); last=now;
  if(playing) time=(time+Math.max(0,delta))%duration;
  draw(time);
});
} catch(error) {
  console.error(error);
  message.textContent='No se pudo cargar la escena 3D. Verificá la conexión a internet y recargá la página.';
}
